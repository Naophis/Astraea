<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astraea Parameter Tuner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1>Astraea Parameter Tuner</h1>
            </div>
            <div class="header-controls">
                <div class="header-group">
                    <label>シリアルポート:</label>
                    <button id="refresh-ports" class="btn btn-secondary btn-sm">更新</button>
                    <select id="port-select" class="select-box-header">
                        <option value="">ポートを選択...</option>
                    </select>
                    <button id="connect-btn" class="btn btn-primary btn-sm">接続</button>
                    <button id="disconnect-btn" class="btn btn-danger btn-sm" disabled>切断</button>
                </div>
                <div class="header-group">
                    <label>モード:</label>
                    <select id="mode-select" class="select-box-header">
                        <option value="">モードを選択...</option>
                    </select>
                </div>
            </div>
            <div class="status-bar">
                <span id="connection-status" class="status-disconnected">未接続</span>
            </div>
        </header>

        <div class="main-content">
            <!-- 左側: プロファイル選択 -->
            <div class="left-panel">

                <!-- プロファイル一覧 -->
                <section class="card profile-section">
                    <h2>プロファイル</h2>

                    <h3>システムファイル</h3>
                    <div id="system-files" class="file-list">
                        <!-- システムファイルがここに表示される -->
                    </div>

                    <h3>プロファイルファイル</h3>
                    <div id="profile-files" class="file-list">
                        <!-- プロファイルファイルがここに表示される -->
                    </div>

                    <div class="control-group">
                        <button id="send-all-btn" class="btn btn-success" disabled>全て送信</button>
                    </div>
                </section>
            </div>

            <!-- 右側: ログ表示 -->
            <div class="right-panel">
                <section class="card log-section">
                    <div class="log-header">
                        <h2>シリアルログ</h2>
                        <button id="clear-log-btn" class="btn btn-secondary btn-sm">クリア</button>
                    </div>
                    <div id="log-output" class="log-output">
                        <!-- ログがここに表示される -->
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
